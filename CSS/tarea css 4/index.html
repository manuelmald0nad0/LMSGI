<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
</head>
<body>
    <main>

        <section id="menu-section">
            <h2 class="section-title">OUR MENU</h2>
            <div class="menu-list">
                <div class="menu-item">
                    <img src="images/hot-beverages.png" alt="Imagen 1" class="menu-image">
                    <h4>Hot Beverages</h4>
                    <p>Wide range of steaming hot coffee to make you fresh and light</p>
                </div>
                <div class="menu-item">
                    <img src="images/cold-beverages.png" alt="Imagen 2" class="menu-image">
                    <h4>Cold Beverages</h4>
                    <p>Creamy and frosty cold coffee to make you cool</p>
                </div>
                <div class="menu-item">
                    <img src="images/refreshment.png" alt="Imagen 3" class="menu-image">
                    <h4>Not Beverages</h4>
                    <p>Fruit and icy refreshing drink to make you refresh </p>
                </div>
            </div>
        </section>

    </main>
</body>
</html>
